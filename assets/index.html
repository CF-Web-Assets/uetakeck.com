<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Domain for non-web use</title>

		<style type="text/css">
			html {
				color-scheme: light dark;
				background: #eee;
				background: light-dark(#eee, #222);
				margin: 0;
				padding: 0;
				font: 16px/1.6 system-ui, sans-serif;
			}

			div {
				width: 600px;
				margin: 5em auto;
				padding: 2em;
				background: #fdfdff;
				background: light-dark(#fdfdff, #333);
				border-radius: 0.5em;
				box-shadow: 2px 3px 7px 2px rgba(0, 0, 0, 0.02);
			}

			p {
				opacity: 0.6;
			}

			a:link,
			a:visited {
				color: #38488f;
				text-decoration: none;
			}

			@media (max-width: 700px) {
				div {
					margin: 0 auto;
					width: auto;
				}
			}
		</style>
	</head>

	<body>
		<div>
			<h1>uetakeck.com</h1>
			<p>No descriptions</p>
			<p></p>
		</div>
	</body>
</html>
